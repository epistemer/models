name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Check go.mod is tidy
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: go mod tidy -diff

      - name: Run tests with race detector
        run: go test -race ./...

  fixtures:
    name: sqlc fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: testdata/sqlc
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: testdata/sqlc/go.sum

      - name: Check the tool module is tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Regenerate the requests with the pinned sqlc
        run: |
          go tool sqlc generate -f ../shop/sqlc.yaml
          go tool sqlc generate -f ../plain/sqlc.yaml

      - name: Fail if a request changed
        working-directory: .
        run: |
          changed=$(git status --porcelain -- testdata/shop testdata/plain testdata/sqlc)
          if [ -n "$changed" ]; then
            echo "sqlc wrote different fixtures; regenerate them (testdata/README.md):"
            echo "$changed"
            git diff --stat -- testdata
            exit 1
          fi
