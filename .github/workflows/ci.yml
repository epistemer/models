name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: |
          for m in . gentest examples/shop; do
            (cd "$m" && go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...)
          done

      # ADR 0003: gentest is a module of its own, so models requires nothing.
      - name: Check every go.mod is tidy
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26.x'
        run: |
          for m in . gentest examples/shop testdata/sqlc; do
            (cd "$m" && go mod tidy -diff)
          done

      - name: Run tests with race detector
        run: go test -race ./...

      # The generators' tests (goldens, refusals, i18ntest) and the example.
      # Both run genx check through genxtest.AssertGenerated, sqlc diff
      # included.
      - name: Test the nested modules
        run: |
          for m in gentest examples/shop; do
            echo "== $m"
            (cd "$m" && go build ./... && go vet ./... && go vet -tags genx ./... \
              && go tool genx check && go test -race ./...)
          done

  fixtures:
    name: sqlc fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: testdata/sqlc
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: testdata/sqlc/go.sum

      - name: Regenerate the requests with the pinned sqlc
        run: |
          go tool sqlc generate -f ../shop/sqlc.yaml
          go tool sqlc generate -f ../plain/sqlc.yaml

      - name: Fail if a request changed
        working-directory: .
        run: |
          changed=$(git status --porcelain -- testdata/shop testdata/plain testdata/sqlc)
          if [ -n "$changed" ]; then
            echo "sqlc wrote different fixtures; regenerate them (testdata/README.md):"
            echo "$changed"
            git diff --stat -- testdata
            exit 1
          fi
