version: "2"
sql:
  - engine: "postgresql"
    schema: "db/schema.sql"
    queries: "db/query.sql"
    gen:
      go:
        package: "models"
        out: "models"
        sql_package: "pgx/v5"
        emit_all_enum_values: true
        # Pointers for null types, and time.Time for dates and times: column
        # sets read either (models A5). sqlc v1.29.0 matches these db_type
        # spellings, and ignores pg_catalog.timestamptz and timestamp.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: {import: "time", type: "Time"}
          - db_type: "timestamptz"
            go_type: {import: "time", type: "Time", pointer: true}
            nullable: true
          - db_type: "date"
            go_type: {import: "time", type: "Time"}
          - db_type: "date"
            go_type: {import: "time", type: "Time", pointer: true}
            nullable: true
      json:
        out: "models"
        filename: "codegen_request.json"
