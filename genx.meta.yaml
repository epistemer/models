# models' trivial generators, over sqlc's codegen request. The contract is
# docs/interface.md; the section numbers below refer to it.
version: 1

params:
  dir:
    doc: the Go package's directory, from the module root, where sqlc writes its models (§3)
    default: models
  package:
    doc: the Go package's name; null means the last element of dir (§3)
    default: null
  table_prefix:
    doc: removed from table and column names in variables, English text and column keys (§3)
    default: ""

defs: |
  # --- Parameters (§3) -----------------------------------------------------

  def go_keywords: ["break", "case", "chan", "const", "continue", "default",
    "defer", "else", "fallthrough", "for", "func", "go", "goto", "if",
    "import", "interface", "map", "package", "range", "return", "select",
    "struct", "switch", "type", "var"];

  def package_name_ok: type == "string" and test("^[A-Za-z_][A-Za-z0-9_]*$")
    and . != "_" and (. as $n | go_keywords | index([$n]) | not);

  # dir_element_ok: genx's rules for an element of an output path (its §7).
  def dir_element_ok:
    test("^[A-Za-z0-9._-]+$") and (startswith(".") | not) and (endswith(".") | not)
    and ((split(".")[0] | ascii_upcase)
         | test("^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])$") | not);

  # params: {dir, pkg, prefix}, checked; stops the run when one is wrong.
  def params:
    $params.dir as $d
    | if ($d | type) != "string" or $d == "" or ($d | startswith("/"))
         or ($d | split("/") | any(. == "" or . == "." or . == ".." or (dir_element_ok | not)))
      then error("models: parameter dir \($d | tojson): not a clean relative slash-separated path")
      else . end
    | (if $params.package == null then ($d | split("/") | last) else $params.package end) as $p
    | if ($p | package_name_ok) then .
      elif $params.package == null
      then error("models: parameter package: \($p | tojson), the last element of dir, is not a Go package name; set package")
      else error("models: parameter package: \($p | tojson) is not a Go package name")
      end
    | if ($params.table_prefix | type) != "string"
      then error("models: parameter table_prefix: \($params.table_prefix | tojson) is not a string")
      else . end
    | {dir: $d, pkg: $p, prefix: $params.table_prefix};

  # --- Naming functions (§5.1) ---------------------------------------------

  def strip($prefix):
    if $prefix != "" and startswith($prefix) then .[($prefix | length):] else . end;

  def zp_parts: [splits("_") | select(length > 0) | (.[0:1] | ascii_upcase) + .[1:]];
  def zp_pascal: zp_parts | join("");
  def readable: zp_parts | join(" ");

  # readable_value: an enum value's English text (§5.1, §5.3, A5.5).
  def readable_value:
    . as $orig
    | split("") as $rs
    | ($rs | length) as $n
    | reduce range($n) as $i ({words: [], cur: ""};
        $rs[$i] as $r
        | if ($r == "." or $r == "_" or $r == "-") then
            if .cur != "" then {words: (.words + [.cur]), cur: ""} else . end
          elif .cur != "" and ($r | test("^\\p{Lu}$")) and
               (($rs[$i - 1] | test("^\\p{Ll}$")) or
                (($rs[$i - 1] | test("^\\p{Lu}$")) and ($i + 1 < $n) and ($rs[$i + 1] | test("^\\p{Ll}$")))) then
            {words: (.words + [.cur]), cur: $r}
          else
            .cur += $r
          end)
    | (if .cur != "" then .words + [.cur] else .words end) as $words
    | if ($words | length) == 0 then $orig
      else [$words[] | (.[0:1] | ascii_upcase) + .[1:]] | join(" ") end;

  # sqlc's EnumReplace: -, /, : and _ become _; other ASCII letters and
  # digits stay; everything else goes.
  def sqlc_replace: [explode[]
    | if (. == 45 or . == 47 or . == 58 or . == 95) then 95
      elif ((. >= 97 and . <= 122) or (. >= 65 and . <= 90) or (. >= 48 and . <= 57)) then .
      else empty end] | implode;

  # sqlc's StructName with initialisms [id], for ASCII names.
  def struct_name: gsub("[^A-Za-z0-9]"; "_")
    | [splits("_") | if . == "id" then "ID" else (.[0:1] | ascii_upcase) + .[1:] end]
    | join("")
    | if test("^[0-9]") then "_" + . else . end;

  # sqlc's numbering of an enum's values (§5.2): [{value, const}].
  def constants($enum):
    reduce ((.vals // []) | to_entries[]) as $e ({seen: {}, out: []};
      ($e.value | sqlc_replace) as $r
      | (if ($r == "" or .seen[$r]) then "value_\($e.key)" else $r end) as $v
      | .seen[$v] = true
      | .out += [{value: $e.value, const: ("\($enum)_\($v)" | struct_name)}])
    | .out;

  # English text (§5.3): the trimmed comment, else the readable name.
  def text($name):
    ((.comment // "") | gsub("^[\\t\\n\\v\\f\\r\\x{85}\\p{Z}]+|[\\t\\n\\v\\f\\r\\x{85}\\p{Z}]+$"; "")) as $c
    | if $c != "" then $c else ($name | readable) end;

  # --- The model of one request, with every check of §6 --------------------

  def go_name_part($what):
    if test("^[\\p{L}\\p{Nd}]+$") then .
    else error("models: \($what) gives \(tojson), which isn't a Go identifier") end;

  # sqlc_start: the start of sqlc's StructName for any name. Unlike
  # struct_name it keeps letters outside ASCII, as sqlc does, so "él10n"
  # isn't read as "L10n"; only the start matters here.
  def sqlc_start: gsub("[^\\p{L}\\p{Nd}]"; "_")
    | [splits("_") | if . == "id" then "ID" else (.[0:1] | ascii_upcase) + .[1:] end]
    | join("");

  def not_reserved($what):
    (sqlc_start) as $g
    | if ($g | startswith("L10n"))
      then error("models: \($what) gives sqlc the Go name \($g | tojson); names starting with \"L10n\" are reserved for labels")
      else . end;

  # unique: stops the run when two labels share $field. (Not written with
  # //, which would swallow the error.)
  def unique($field; $name):
    ([group_by(.[$field])[] | select(length > 1)][0]) as $d
    | if $d == null then .
      else error("models: \($d[0].src) and \($d[1].src) both give the \($name) \($d[0][$field] | tojson)") end;

  # model($p): {enums: [{type, constants}], labels: [...]} for the request
  # that is the input, or an error.
  def model($p):
    .catalog as $c
    | $c.default_schema as $ds
    | ([$c.schemas[]? | select(.name == $ds)][0]
       // error("models: the default schema \($ds | tojson) isn't in the request")) as $s
    | ([$c.schemas[]?
        | select(.name != $ds and (.name | IN("pg_catalog", "information_schema", "pg_temp") | not))
        | select(((.tables // []) | length) > 0 or ((.enums // []) | length) > 0)][0]) as $other
    | if $other != null
      then error("models: schema \($other.name | tojson) has tables or enums; only the default schema \($ds | tojson) is supported")
      else . end
    | ([.queries[]? | .name | not_reserved("query \(tojson)")] | length) as $_
    | [$s.enums[]?
       | .name as $e
       | if ($e | test("[^\\x00-\\x7F]")) or ($e | struct_name) == ""
         then error("models: enum \($e | tojson): sqlc's Go name for it can't be derived")
         else . end
       | ($e | not_reserved("enum \($e | tojson)")) as $_
       | {name: $e, type: ($e | struct_name), constants: constants($e)}] as $enums
    | ([$enums[] | . as $e | $enums[]
        | (select(.type == "All\($e.type)Options") | {name: $e.name, fn: .type, other: "enum \(.name | tojson)'s Go type"}),
          (.name as $o | .constants[] | select(.const == "All\($e.type)Options")
           | {name: $e.name, fn: .const, other: "a constant of enum \($o | tojson)"})][0]) as $opt
    | if $opt != null
      then error("models: enum \($opt.name | tojson) gives the function \($opt.fn | tojson), which is \($opt.other)")
      else . end
    | ([$enums | group_by(.type)[] | select(length > 1)][0]) as $twin
    | if $twin != null
      then error("models: enum \($twin[0].name | tojson) and enum \($twin[1].name | tojson) both give sqlc the Go type \($twin[0].type | tojson)")
      else . end
    | [$s.tables[]?
       | .rel.name as $t
       | ($t | not_reserved("table \($t | tojson)")) as $_
       | ($t | strip($p.prefix) | zp_pascal | go_name_part("table \($t | tojson)")) as $T
       | {name: $t, T: $T, text: text($t | strip($p.prefix)),
          columns: [.columns[]?
            | .name as $col
            | ($col | strip($p.prefix) | zp_pascal
               | go_name_part("column \($t | tojson).\($col | tojson)")) as $C
            | {name: $col, C: $C, text: text($col | strip($p.prefix))}]}] as $tables
    | ([$enums[] | .name as $e | .constants[]
        | {src: "enum \($e | tojson) value \(.value | tojson)",
           key: "enum.\($e).\(.value)", path: "enum.\($e).\(.value)",
           text: (.value | readable_value), var: "L10n\(.const)"}]
       + [$tables[] | .name as $t | .T as $T
          | {src: "table \($t | tojson)", key: "table.\($t)", path: "table.\($t)",
             text: .text, var: "L10n\($T)"},
            (.columns[]
             | {src: "column \($t | tojson).\(.name | tojson)",
                key: "table.\($t).\($T)_\(.C)", path: "table.\($t).\(.name)",
                text: .text, var: "L10n\($T)_\(.C)"})]) as $labels
    | ($labels | unique("key"; "key") | unique("path"; "path") | unique("var"; "variable")) as $_
    | {schema: $ds, enums: [$enums[] | {name, type, constants}], labels: [$labels[] | del(.src)]};

  # view_type: sqlc's type for a relation whose name ends in _view. sqlc
  # makes names singular, and of its rules only ^(ox)en ignores the end of
  # the name (oxen_view is OxView).
  def view_type: sub("^(?<a>ox)en"; "\(.a)"; "i") | struct_name;

  # The names a views file uses that a query's constant could hide: the
  # package it imports and the predeclared ones its methods use.
  def views_names: ["listing", "column", "context", "append", "len", "nil", "int64", "string", "error"];

  # sql_type: a column's SQL type name, without pg_catalog's qualification.
  def sql_type($ds): ((.type.name // "") | sub("^(pg_catalog|\($ds))\\."; ""));

  # column_how: a view column's kind (§4.6, A4), from its SQL type; null
  # for a type no kind takes, which the set leaves out. Every getter but an
  # enum's is column.Field, which reads whatever Go type sqlc gives the
  # field (A5); an enum's reads sqlc's <Type> or Null<Type>, which sqlc
  # keeps with emit_pointers_for_null_types. $enums: the schema's enum names.
  def column_how($f; $ds; $enums):
    (.not_null // false) as $nn
    | sql_type($ds) as $t
    | if (.is_array // false) then null
      elif $t | IN("text", "varchar", "bpchar", "char", "citext", "name", "uuid") then {kind: "Text"}
      elif $t | IN("int2", "smallint", "smallserial", "serial2", "int4", "integer", "int",
                   "serial", "serial4", "int8", "bigint", "bigserial", "serial8") then {kind: "Integer"}
      elif $t | IN("float4", "real", "float8", "double precision", "numeric", "decimal") then {kind: "Number"}
      elif $t | IN("bool", "boolean") then {kind: "Bool"}
      elif $t == "date" then {kind: "Date"}
      elif $t | IN("timestamp", "timestamptz") then {kind: "Time"}
      elif $t | IN($enums[]) then
        ($t | struct_name) as $E
        | if $nn then {kind: "Enum", check: false, value: "Enum: r.\($f)", enum: $E}
          else {kind: "Enum", check: true, value: "Enum: r.\($f).\($E)", enum: $E} end
      else null end;

  # listings: the relations views writes a method for (§4.3), with the
  # checks of §6 that are views' own, and each one's column set (§4.6).
  # The input is the request; model($p) has checked it already.
  def listings($p):
    .catalog as $c
    | $c as $c0
    | [$c.schemas[] | select(.name == $c.default_schema)][0] as $s
    | [$s.tables[]? | select(.rel.name | endswith("_view"))] as $rels
    | if ($rels | length) == 0 then []
      else
        (if .settings.engine != "postgresql"
         then error("models: views need PostgreSQL; the request's engine is \(.settings.engine | tojson)")
         else . end)
        | [.queries[]? | .name] as $queries
        | [$s.enums[]? | .name] as $enum_names
        | ([$queries[] | {name: ., const: ((.[0:1] | ascii_downcase) + .[1:])}
            | select(.const | IN(views_names[]))][0]) as $q
        | if $q != null
          then error("models: query \($q.name | tojson) gives sqlc the constant \($q.const | tojson), which hides a name the views file uses")
          else . end
        | ([$s.enums[]? | select((.name | struct_name) == "Listings")][0]) as $e
        | if $e != null
          then error("models: enum \($e.name | tojson) gives sqlc the Go name \"Listings\", which views declares")
          else . end
        | [$rels[]
           | .rel.name as $v
           | if ($v | test("[^\\x20-\\x7E]"))
             then error("models: view \($v | tojson): sqlc's Go name for it can't be derived")
             else . end
           | if ((.columns // []) | length) == 0
             then error("models: view \($v | tojson) has no columns")
             else . end
           | [.columns[]
              | .name as $col
              | if ($col | test("[^\\x20-\\x7E]")) or ($col | struct_name) == ""
                then error("models: view \($v | tojson) column \($col | tojson): sqlc's Go name for it can't be derived")
                else . end
              | {name: $col, field: ($col | struct_name)}] as $cols
           | ([$cols | group_by(.field)[] | select(length > 1)][0]) as $d
           | if $d != null
             then error("models: view \($v | tojson): columns \($d[0].name | tojson) and \($d[1].name | tojson) both give the field \($d[0].field | tojson)")
             else . end
           | ($v | view_type) as $type
           | if "List\($type)" | IN($queries[])
             then error("models: query \("List\($type)" | tojson) clashes with the listing method of view \($v | tojson)")
             else . end
           | if "\($type)Columns" | IN($queries[]) or IN($s.tables[]?.rel.name | view_type) or IN($s.enums[]?.name | struct_name)
             then error("models: view \($v | tojson): its column set \("\($type)Columns" | tojson) is already a query's, a relation's or an enum's Go name")
             else . end
           | ($v | strip($p.prefix) | zp_pascal) as $T
           | [.columns[]
              | . as $c
              | ($c.name | struct_name) as $f
              | column_how($f; $c0.default_schema; $enum_names) as $how
              | if $how == null then {name: $c.name, field: $f, left: (($c | sql_type($c0.default_schema)) + (if ($c.is_array // false) then "[]" else "" end))}
                else {name: $c.name, field: $f,
                      label: "L10n\($T)_\($c.name | strip($p.prefix) | zp_pascal)",
                      kind: $how.kind, check: ($how.check // false),
                      value: ($how.value // ""), enum: ($how.enum // "")}
                end] as $set
           | {name: $v, type: $type, method: "List\($type)", columns: $cols,
              colset: [$set[] | select(.left == null)],
              left: [$set[] | select(.left != null) | "\(.name) (\(.left))"]}] as $views
        | ([$views | group_by(.type)[] | select(length > 1)][0]) as $twin
        | if $twin != null
          then error("models: views \($twin[0].name | tojson) and \($twin[1].name | tojson) both give sqlc the Go type \($twin[0].type | tojson)")
          else $views end
      end;

  # The names a pgx file uses that a query's constant could hide: the
  # package it imports and the predeclared ones its function uses.
  def pgx_names: ["context", "pgx", "string", "error", "nil"];

  # pgx_types($m): the checks of §6 that are pgx's own, and the data for
  # pgx.go.tmpl. Input is the request; $m is model($p).
  def pgx_types($m):
    if ($m.enums | length) == 0 then empty
    else
      ([.queries[]? | .name | {name: ., const: ((.[0:1] | ascii_downcase) + .[1:])}
        | select(.const | IN(pgx_names[]))][0]) as $q
      | if $q != null
        then error("models: query \($q.name | tojson) gives sqlc the constant \($q.const | tojson), which hides a name the pgx file uses")
        else . end
      | ([$m.enums[] | select(.type == "RegisterTypes")][0]) as $reg
      | if $reg != null
        then error("models: enum \($reg.name | tojson) gives sqlc the Go name \"RegisterTypes\", which pgx declares")
        else . end
      | {example: $m.enums[0].type,
         names: [$m.enums[] | {enum: "\($m.schema).\(.name)", array: "\($m.schema)._\(.name)"}]}
    end;

  # requests: the one request, if any (§6: never two).
  def request:
    .["sqlc.request/v1"] as $r
    | if ($r | length) > 1 then error("models: \($r | length) sqlc requests; one is supported")
      else $r[] end;

generators:
  labels:
    doc: a labels/v1 file for every enum value, table, view and column of sqlc's default schema
    needs: [sqlc.request/v1]
    emits: labels/v1
    units: |
      params as $p
      | request
      | model($p)
      | select(.labels | length > 0)
      | {domain: "labels/v1", producer: "models",
         package: {name: $p.pkg, dir: $p.dir}, labels: .labels}
    out: '"\(.package.dir)/zz_\(.package.name).labels.json"'

  enums:
    doc: Label(), Value(), MarshalText(), UnmarshalText() and All<Type>Options() for every enum type of sqlc's default schema
    needs: [sqlc.request/v1]
    units: |
      params as $p
      | request
      | model($p)
      | select(.enums | length > 0)
      | {package: $p.pkg, dir: $p.dir, enums: .enums}
    out: '"\(.dir)/zz_\(.package)_enums.go"'
    template: enums.go.tmpl

  views:
    doc: a List<Type> method on sqlc's Queries and a <Type>Columns set for every relation whose name ends in _view (pgx/v5)
    needs: [sqlc.request/v1]
    units: |
      params as $p
      | request
      | model($p) as $_
      | listings($p)
      | select(length > 0)
      | {package: $p.pkg, dir: $p.dir, views: .}
    out: '"\(.dir)/zz_\(.package)_views.go"'
    template: views.go.tmpl

  pgx:
    doc: RegisterTypes(ctx, conn) for every enum and enum array of sqlc's default schema (pgx/v5)
    needs: [sqlc.request/v1]
    units: |
      params as $p
      | request
      | model($p) as $m
      | pgx_types($m)
      | {package: $p.pkg, dir: $p.dir, example: .example, names: .names}
    out: '"\(.dir)/zz_\(.package)_pgx.go"'
    template: pgx.go.tmpl
